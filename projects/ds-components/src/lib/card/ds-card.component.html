<mat-card class="ds-card" [class.ds-card--flat]="!elevated">
  <mat-card-header *ngIf="title || subtitle" class="ds-card__header">
    <mat-card-title *ngIf="title">{{ title }}</mat-card-title>
    <mat-card-subtitle *ngIf="subtitle">{{ subtitle }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content class="ds-card__content">
    <ng-content></ng-content>
  </mat-card-content>
  <mat-card-actions class="ds-card__actions" align="end">
    <ng-content select="[ds-card-actions]"></ng-content>
  </mat-card-actions>
</mat-card>
