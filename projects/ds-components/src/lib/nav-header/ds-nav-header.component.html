<mat-toolbar color="primary" class="ds-nav-header">
  <button mat-icon-button class="ds-nav-header__menu" aria-label="Toggle menu" (click)="menuToggle.emit()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="ds-nav-header__brand">{{ appName }}</span>
  <nav class="ds-nav-header__links">
    <a
      *ngFor="let link of links"
      mat-button
      class="ds-nav-header__link"
      [class.ds-nav-header__link--active]="link.active"
      [href]="link.route"
      (click)="onNavigate(link, $event)"
    >
      {{ link.label }}
    </a>
  </nav>
  <span class="ds-nav-header__spacer"></span>
  <ng-content select="[ds-nav-actions]"></ng-content>
</mat-toolbar>
