<div class="ds-data-table" [class.ds-data-table--striped]="striped">
  <table mat-table [dataSource]="rows">
    <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
      <th mat-header-cell *matHeaderCellDef [style.width]="col.width || null">{{ col.header }}</th>
      <td mat-cell *matCellDef="let row">{{ row[col.key] }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <div *ngIf="!rows.length" class="ds-data-table__empty">No records to display</div>
</div>
